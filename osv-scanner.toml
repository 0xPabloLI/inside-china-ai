# Documented vulnerability risk acceptances for `npm run scan:deps`
# (osv-scanner auto-loads this file from the repo root).
#
# Rules for this file:
# - An entry listed here is ignored; there is no enable/disable flag.
# - Every entry needs a written rationale AND a revisit condition.
# - "No fixed release exists" or "fix is vendor-pinned" are the only valid
#   reasons to be here. If a fix becomes reachable, delete the entry and let
#   the scan go red until the dependency lands.

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = "sprintf-js <=1.1.3 (DoS via unbounded precision specifiers): no fixed release exists — the package last published in 2023 and 1.1.3 is still affected. Only reachable via gray-matter -> js-yaml@3 -> argparse, which our build scripts (scripts/rag, scripts/article) use to parse repo-authored markdown; format strings are not attacker-controlled. Revisit if upstream patches or gray-matter migrates to js-yaml@4."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge <=4.3.1 (prototype poisoning in mergeObject): no fixed release exists — checked against the npm registry on 2026-10-28, `dist-tags.latest` is 4.3.1 and the full version list ends at 4.3.1 (published 2023-03). Only reachable via @react-email/render -> html-to-text -> deepmerge, which merges html-to-text *options* (static library options in our email rendering), never user- or remote-supplied merge sources, so the poisoned-object path is not attacker-reachable here. Revisit when @react-email/render moves to html-to-text 10 (deepmerge-ts) or deepmerge ships a fix."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch 10.2.6 (DoS via globParts amplification in firstPhasePreProcess when optimizationLevel >= 2): fix is vendor-pinned — the only fixed release is 11.0.1, while eslint 10.x (including the latest 10.14.0) declares minimatch ^10.2.5/^10.2.6 and 10.x has no patched release. Renovate's minor/patch and lockfile-maintenance PRs cannot cross that major (verified 2026-10-31: none touches minimatch). Reachable only through dev tooling (eslint / @eslint/config-array / @typescript-eslint) matching repo-authored lint patterns, never attacker-supplied globs, so the amplified input is not attacker-controlled here. Revisit when eslint (or its replacement) allows minimatch 11 — delete this entry and let the scan go red until the bump lands."
