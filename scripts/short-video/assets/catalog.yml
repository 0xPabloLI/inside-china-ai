# Query: node scripts/rag/query.mjs "search text" --type asset-catalog
# See: docs/media-asset-management.md §2
# width/height are required for new entries — check with `npm run lint:catalog`.
# The entries still missing them are frozen in lib/catalog-validate.mjs
# (LEGACY_CATALOG_FILES_WITHOUT_DIMENSIONS); that list may only shrink.

