name: Auto-resolve droid threads on bot PRs

# Dependency-manifest-only PRs from Renovate/Dependabot routinely get advisory
# factory-droid threads (bun.lock drift, etc.). Left unresolved, they block the
# main-merge-gate ruleset's thread-resolution requirement and stall platform
# automerge. This workflow resolves factory-droid threads automatically on
# bot-authored PRs only — human-authored PRs keep the manual gate.

on:
  workflow_run:
    workflows: ["Droid Auto Review"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  auto-resolve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve factory-droid threads on bot-authored PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this workflow run — nothing to do."
            exit 0
          fi
          AUTHOR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.user.login')
          echo "PR #$PR_NUMBER authored by $AUTHOR"
          if ! echo "$AUTHOR" | grep -qE '^(app/)?(renovate|dependabot)(\[bot\])?$'; then
            echo "Human-authored PR — leaving review threads for manual resolution."
            exit 0
          fi
          gh api graphql -f query='
            query($owner:String!, $name:String!, $pr:Int!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 1) { nodes { author { login } } }
                    }
                  }
                }
              }
            }' \
            -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | select(.comments.nodes[0].author.login == "factory-droid")
                  | .id' > threads.txt
          COUNT=$(grep -c . threads.txt || true)
          echo "Unresolved factory-droid threads: $COUNT"
          if [ "$COUNT" = "0" ]; then exit 0; fi
          while read -r THREAD_ID; do
            gh api graphql -f query='
              mutation($t:ID!) {
                resolveReviewThread(input:{threadId:$t}) { thread { isResolved } }
              }' -f t="$THREAD_ID" --jq '.data.resolveReviewThread.thread.isResolved'
          done < threads.txt
