name: TEMP probe end-to-end

# Throwaway end-to-end probe. Answer with evidence, then delete the file.
#
# Questions it settles in one run:
#   Q1 do the checks on a GITHUB_TOKEN-authored PR really park at
#      `action_required` (= the state that makes a release PR permanently
#      BLOCKED)?
#   Q2 can GITHUB_TOKEN approve them (permission — already suggested by the
#      403 "not waiting for approval" message, but not yet proven on a run
#      that IS waiting)?
#   Q3 after approval, does the run actually START, or is it suppressed
#      because GITHUB_TOKEN triggered it? (This is the one that decides
#      whether an in-workflow self-approve is a real fix or a no-op.)
#
# It builds its own bot-authored PR on a branch named after the release-please
# pattern, watches for the held runs, approves them, prints the resulting
# states, then closes the PR and deletes the branch. Cleanup is idempotent:
# the branch name is fixed, so re-runs force-push over the same branch.
#
# Triggered by push because workflow_dispatch is only accepted for a workflow
# that already exists on the default branch. Not pushing this to main.

on:
  push:
    branches:
      - session/20260925-release-pr-approve-b261bb

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Bot PR -> held run -> approve -> started?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          BR="release-please--branches--main--components--probe"
          PR=""
          cleanup() {
            echo "--- cleanup ---"
            if [ -n "$PR" ]; then gh pr close "$PR" --delete-branch 2>&1 | tail -2; fi
            git -C repo push origin --delete "$BR" 2>&1 | tail -1 || true
          }
          trap cleanup EXIT

          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "probe"

          echo "== clone main =="
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" repo
          cd repo
          git checkout -q -b "$BR"
          date -u > "probe-$RUN.txt"
          git add "probe-$RUN.txt"
          git commit -q -m "chore: throwaway probe $RUN"
          echo "== push probe branch =="
          git push -q -f origin "$BR" && echo "pushed $BR"

          echo "== Q1: open the bot PR =="
          PR=$(gh api -X POST "repos/$REPO/pulls" \
            -f title="chore: throwaway probe $RUN" \
            -f head="$BR" -f base="main" \
            -f body="Automated probe of the held-run mechanism. Safe to ignore; closes itself." \
            --jq .number)
          echo "opened PR #$PR"
          SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          echo "head sha $SHA"

          echo "== Q1: waiting for checks to park at action_required =="
          found=""
          for i in $(seq 1 18); do
            found=$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha==\"$SHA\") | \"\(.id)\t\(.name)\"")
            if [ -n "$found" ]; then
              echo "held after ${i} probe(s):"
              printf '%s\n' "$found"
              break
            fi
            sleep 10
          done

          if [ -z "$found" ]; then
            echo "::error::Q1 FAILED - no run parked at action_required; premise of the whole fix is wrong"
            exit 1
          fi

          echo "== Q2: approve them with GITHUB_TOKEN =="
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            printf 'approve %s (%s): ' "$name" "$id"
            gh api -X POST "repos/$REPO/actions/runs/$id/approve" --jq '"ok"' 2>&1 | tail -1
          done <<<"$found"

          echo "== Q3: do they actually start? (sampled for ~60s) =="
          for i in $(seq 1 6); do
            sleep 10
            echo "-- t+$((i * 10))s --"
            gh api "repos/$REPO/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha==\"$SHA\") | \"  \(.name)\t\(.status)\t\(.conclusion // \"-\")\tattempt=\(.run_attempt)\""
          done
          echo "== done =="
