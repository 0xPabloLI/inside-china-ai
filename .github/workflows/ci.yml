name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    # macOS arm64 matches the platform this repo targets (README: Node arm64 +
    # brew ffmpeg). The ubuntu run exposed 12 test files with platform-specific
    # failures — cross-platform test portability is separate debt.
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      # Bridge: env-bound suites (see vitest.config.ts) can't run on CI
      VITEST_CI_SKIP_ENV_BOUND: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        # Switched back to npm ci alongside the 2026-09-25 lockfile re-sync
        # (the commits above). The old comment claimed npm ci hard-fails on
        # @emnapi/* "even after a fresh lockfile re-resolution" — disproven
        # locally (npm 10.9.7 / node 22.22.2, #347) and on this runner
        # (macos-latest / node 22, run 36147033582: added 730 packages in
        # 12s). npm ci keeps the strict sync check, so future lockfile drift
        # fails fast here instead of being silently reconciled.

      - name: Lint (changed files only)
        env:
          # Routed through env so event data never lands in the shell line
          # directly (script-injection hygiene).
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Incremental lint gate: a full `eslint .` over the tree is slow,
          # so the gate is a ratchet instead — every file touched by a PR/push
          # must be lint-clean. (The ~1000 pre-existing prettier errors this
          # gate originally worked around were cleared by the 2026-09-14
          # repo-wide format; the ratchet stays as the fast path.)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            BASE=$(git rev-parse HEAD^)
          fi
          # The checkout is shallow (fetch-depth defaults to 1), so BASE is
          # normally absent from the object store — `git diff` then dies with
          # "fatal: bad object <BASE>" and the `|| true` that used to sit on
          # the diff line turned that failure into "no changed files": the
          # gate reported green while scanning nothing, on every PR and every
          # push (confirmed in runs 38261215620 / 38261502835, see #447).
          # Fetch BASE explicitly, and fail loudly if it still won't resolve —
          # a gate that scans nothing must never look green.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BASE" ||
              git fetch --unshallow origin ||
              echo "::warning::could not fetch BASE $BASE (tried shallow + unshallow)"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve BASE $BASE — incremental lint would scan nothing"
            exit 1
          fi
          # `|| true` is gone from the diff: a failed diff is a failed gate.
          # The one below only absorbs grep's "no lines matched".
          if ! FILES=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
            -- '*.ts' '*.tsx' '*.mjs' '*.js'); then
            echo "::error::git diff against BASE=$BASE failed"
            exit 1
          fi
          FILES=$(printf '%s\n' "$FILES" | grep -v '^src/routeTree.gen.ts$' || true)
          if [ -z "$FILES" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          printf '%s\n' "$FILES" | xargs npx eslint

      - name: MJS correctness gate (full scan)
        # #447: the incremental ratchet above only sees changed files, so the
        # ~527 first-party .mjs scripts were never checked for correctness
        # bugs at all (that silence is how #424's `const` reassignment reached
        # main). This scans all of them on every run — correctness rules only,
        # formatting deliberately left to the ratchet.
        run: npm run lint:mjs

      - name: Hook liveness gate
        # #406: a hook that sits where git does not read it performs no check,
        # silently. The gate needs the activation step to have run — a fresh
        # clone has no core.hooksPath — so this also exercises the install path
        # itself, which is the entry point the README tells humans to use.
        run: |
          npm run setup:hooks
          npm run lint:hooks

      - name: Doc hierarchy lint
        # #782: the registration gate only checks docs added or renamed in this
        # change, so CI must hand the linter a base commit; a shallow checkout
        # needs the same explicit fetch-and-fail-loudly treatment as the lint
        # step above. Without a resolvable base the gate reports FAIL instead
        # of scanning nothing and looking green.
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
          DOCS_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$DOCS_BASE"
          elif [ "$DOCS_PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$DOCS_PUSH_BEFORE"
          else
            BASE=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BASE" ||
              git fetch --unshallow origin ||
              echo "::warning::could not fetch DOCS_BASE $BASE"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::error::cannot resolve DOCS_BASE $BASE — registration gate would scan nothing"
            exit 1
          fi
          DOCS_BASE="$BASE" npm run lint:docs

      - name: Product view gate (PR body)
        # #810: §9 step 8 has required the three sentences since 2026-10-13 and
        # deliveries kept skipping them — §12 records that wording was never the
        # problem, blocking force was. The body is checked here, before CI goes
        # green, because a close-out check can only be satisfied retroactively.
        # This job is a required check, so the gate inherits the block.
        if: github.event_name == 'pull_request'
        env:
          # Routed through env, same hygiene as PR_BASE above: event data never
          # lands in the shell line. A push to main has no pull request, hence
          # the `if` — the script would otherwise fail on a missing body.
          # No head-branch value on purpose: the head branch is author-controlled,
          # so it is not an input this gate may trust (see the exemption note in
          # the script).
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-product-view.mjs

      - name: Generated API docs are fresh
        run: npm run docs:api -- --check

      - name: TODO marker gate
        run: npm run lint:todos

      # Build BEFORE type check: src/routeTree.gen.ts is generated (gitignored)
      # by the TanStack router plugin during vite build — a fresh checkout has
      # no route tree, so tsc must run after generation.
      - name: Production build
        run: npm run build

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@users.noreply.github.com"

      # Several suites shell out to ffmpeg with libmp3lame (audio-sync
      # fixtures). brew ffmpeg matches the documented dev setup and includes
      # libmp3lame — gate on the exact encode path they use.
      - name: Install ffmpeg and verify libmp3lame
        run: |
          set -e
          brew install ffmpeg
          ffmpeg -version | head -1
          TMP=$(mktemp -d)
          ffmpeg -hide_banner -f lavfi -i "sine=frequency=440:duration=1" -codec:a libmp3lame -q:a 4 "$TMP/t.mp3" 2>/dev/null
          rm -rf "$TMP"
          echo "mp3 encode OK"

      # Python suite (#555): the 15 test_*.py files under
      # scripts/short-video/__tests__ never ran anywhere in CI — test_claim_prompt.py
      # sat red on main until someone noticed by hand. Dependencies come from
      # the suite's requirements.txt into a throwaway venv rather than the
      # runner's Python, so this gate does not depend on preinstalled packages
      # (and stays PEP 668 safe).
      - name: Python test environment (pytest + Pillow)
        run: |
          python3 -m venv .scratch/pytest-venv
          .scratch/pytest-venv/bin/python -m pip install --quiet --upgrade pip
          .scratch/pytest-venv/bin/python -m pip install --quiet \
            -r scripts/short-video/__tests__/requirements.txt

      # Single runner for the whole Python suite, with the Python half of the
      # coverage ratchet (npm run test:python:coverage). The conftest zero-test
      # guard fails the step if any test_*.py collects no tests and the log
      # prints the per-file count table, so a green step cannot mean "nothing
      # ran"; .coveragerc's fail_under fails it when the measured modules drop.
      - name: Python tests (pytest)
        env:
          PYTHON: .scratch/pytest-venv/bin/python
        run: |
          # test_video_loader.py generates real media with the repo's
          # documented ffmpeg (/opt/homebrew/opt/ffmpeg-full/bin/ffmpeg), which
          # this runner does not have. Point the suite's own override
          # (VIDEO_LOADER_FFMPEG, video_loader._binary) at the brew binary from
          # the "Install ffmpeg and verify libmp3lame" step above instead of
          # skipping its 22 fixtures.
          export VIDEO_LOADER_FFMPEG="$(command -v ffmpeg)"
          echo "python suite ffmpeg: $VIDEO_LOADER_FFMPEG"
          npm run test:python:coverage

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: .scratch/coverage-python
          retention-days: 7

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests with coverage
        # junit reporter alongside default: per-test durations land in a
        # machine-readable artifact so slow-test trends are inspectable, not
        # just pass/fail.
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .scratch/coverage
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-results/junit.xml
          retention-days: 7

      - name: Dead code & unused dependencies (knip)
        run: npx knip

      - name: Duplicate code (jscpd)
        run: npm run lint:duplicates

      - name: Bundle size budget (size-limit)
        run: npm run check:size

  # #1087: the pixel-contract suites that drive a real render. They sit in
  # vitest.config.ts's CI_SKIPPED_MACHINE_BOUND because the render runtime lives
  # in `scripts/short-video/remotion`, which has its own lockfile — the root
  # `npm ci` above never created that workspace or its headless browser, so the
  # suites were not red in CI, they were absent from it. `media-focus-render`
  # stayed red on main for two days (#1084) behind delivery records that only
  # said "1 known-red": nothing was watching.
  #
  # Separate job on purpose: `Lint, typecheck, test` is at 15 minutes and ~4.5
  # minutes of use; installing the workspace and downloading a browser there
  # would push it into the timeout.
  #
  # Scope: all eight `npx remotion still` suites (#1087 chose option 3 first,
  # then 1 — prove a runner renders deterministically, then widen). Steps ① and
  # ② settled the tolerance/retry question, so the widening happened in step ③:
  # five joined `media-focus-render`. The last two, `contrast-media-render` and
  # `scene-gate-render`, were a measured blocker rather than a pending item —
  # they render the scene-gate fixture, which bound `assets/pexels-ai-chip.jpg`,
  # a `pexels-*` file `.gitignore` keeps out of the repo, so a clean checkout
  # 404'd where the picture should be. #1093 replaced that binding with a path
  # the suites generate through ffmpeg into gitignored `assets/_fixture/`: no
  # committed binary, nothing to download, nothing for `session-provision` to
  # copy.
  pixel-render:
    name: Pixel render contracts
    # Same platform as the quality job: these suites compare rendered pixels
    # against a source palette, so runner OS must match the target platform
    # (README: Node arm64 + brew ffmpeg).
    runs-on: macos-latest
    # Eight suites, ~230 s serially on an M2 Pro once every assertion goes through
    # `__tests__/remotion-still.mjs` (#1097: one bundle + one browser per test
    # file). Before that driver the same eight took 15m42s on the runner, because
    # each still spawned `npx remotion still` — 13.2 s of process, bundle and
    # browser startup for 0.8 s of render.
    #
    # 25 min stays as the budget: it held when the suite step was 15m42s, and the
    # driver is what took it back to minutes. If a future suite lands near this
    # ceiling, split the slow suites into a second job rather than raise it — the
    # number is a budget, not a target.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # Both lockfiles: the root install and the render workspace are the
          # two dependency graphs this job needs, and either one drifting is a
          # cache miss — not a silently stale workspace.
          cache-dependency-path: |
            package-lock.json
            scripts/short-video/remotion/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # The workspace install that every other CI job skips. `--prefix` rather
      # than `cd` so the lockfile check still applies to that directory's own
      # package-lock.json (an out-of-sync one must fail here, as at the root).
      - name: Install render workspace
        run: npm ci --no-audit --no-fund --prefix scripts/short-video/remotion

      # Remotion downloads chrome-headless-shell on the first render. Doing it
      # as its own step keeps the two failure classes apart in the log: "the
      # browser would not start" (environment) vs "a pixel assertion failed"
      # (the contract). test-env-baseline.md documents a local crash mode where
      # a freshly downloaded shell dies with `ProtocolError: Target closed` /
      # `icudtl.dat not found` — if that ever happens here, this is the step
      # that says so instead of a render suite timing out.
      - name: Ensure the headless browser
        working-directory: scripts/short-video/remotion
        run: npx remotion browser ensure

      # The fixtures generate colour-banded sources with ffmpeg at test time
      # (no committed binaries), so the render job needs the same encoder the
      # quality job verifies.
      - name: Install ffmpeg and verify libmp3lame
        run: |
          set -e
          brew install ffmpeg
          ffmpeg -version | head -1
          TMP=$(mktemp -d)
          ffmpeg -hide_banner -f lavfi -i "sine=frequency=440:duration=1" -codec:a libmp3lame -q:a 4 "$TMP/t.mp3" 2>/dev/null
          rm -rf "$TMP"
          echo "mp3 encode OK"

      # `--retry=0` overrides the config's CI retry: that retry exists for
      # load-sensitive ffmpeg suites, and here it would hide exactly the
      # cross-runner pixel jitter this job was opened to measure.
      #
      # `--no-file-parallelism`: each suite renders through its own headless
      # browser, so running them together makes the runner's core count the
      # variable — and a CPU-starved render fails as a pixel assertion, which
      # is indistinguishable from a real framing defect. Serially the eight are
      # ~230 s on an M2 Pro through `remotion-still.mjs`; before that driver each
      # assertion spawned its own `npx remotion still`, which is why the same
      # work took 15m42s on the runner. Do not add a suite that spawns the CLI:
      # `__tests__/render-suite-policy.test.mjs` rejects it in the quality job.
      #
      # The last two suites arrived with #1093: `contrast-media-render` and
      # `scene-gate-render` share the scene-gate fixture, whose picture is now
      # generated by the suites themselves (ffmpeg → gitignored
      # `assets/_fixture/`) instead of a `pexels-*` photo `.gitignore` keeps out
      # of the repo. That photo was the whole reason they could not run on a
      # clean checkout: 404 at render time, `Could not load <CanvasImage>`
      # (run 41304281947). Nothing is committed and nothing is provisioned —
      # a fresh clone plus the two installs below is enough.
      #
      # VITEST_CI_SKIP_ENV_BOUND is deliberately NOT set here — that env gate is
      # what excludes these suites in the quality job, and leaving it unset is
      # how this file opts into running them.
      - name: Pixel render contracts (8 suites)
        run: |
          npx vitest run --no-file-parallelism --retry=0 \
            scripts/short-video/__tests__/media-focus-render.test.mjs \
            scripts/short-video/__tests__/media-start-offset.test.mjs \
            scripts/short-video/__tests__/media-zoom-render.test.mjs \
            scripts/short-video/__tests__/official-fit-render.test.mjs \
            scripts/short-video/__tests__/text-gate-render.test.mjs \
            scripts/short-video/__tests__/avatar-card-render.test.mjs \
            scripts/short-video/__tests__/contrast-media-render.test.mjs \
            scripts/short-video/__tests__/scene-gate-render.test.mjs

      # The stills are the evidence trail for a red run: a sampled pixel value
      # says which band landed where, and the PNG says whether the frame was
      # rendered at all (a black frame and a mis-cropped frame fail differently).
      # Four of the eight persist them (media-focus / media-zoom / media-offset /
      # contrast-media); text-gate, official-fit, avatar-card and scene-gate
      # render into `mkdtemp`. The glob
      # covers every `*-stills` directory under the gitignored `output/`, so a
      # suite that starts persisting is picked up without touching this step.
      - name: Upload stills
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-stills
          path: scripts/short-video/output/*-stills
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan (SARIF)
        run: semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif src/ scripts/

      # Drops the documented test-fixture false positives (rule id AND test
      # path; classes in docs/conventions/test-env-baseline.md, filter and its
      # guards in .github/scripts/filter-semgrep-fps.py).
      - name: Drop documented test-fixture false positives
        run: python3 .github/scripts/filter-semgrep-fps.py semgrep.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
