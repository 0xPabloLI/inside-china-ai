name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Bridge while the research suites are mid-refactor (see vitest.config.ts)
      VITEST_CI_SKIP_RESEARCH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        # npm ci is unusable here: @tailwindcss/oxide-wasm32-wasi declares
        # @emnapi/* as bundled optional peers and npm's strict ci sync check
        # hard-fails on them even after a fresh lockfile re-resolution
        # (upstream npm/cli bug). npm install reconciles the tree the same way
        # every contributor's `npm install` does.

      - name: Lint (changed files only)
        env:
          # Routed through env so event data never lands in the shell line
          # directly (script-injection hygiene).
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Incremental lint gate: the repo carries ~1000 pre-existing
          # prettier/prettier formatting errors (hooks never ran eslint), so a
          # full `eslint .` would be red from day one and a repo-wide format
          # pass needs coordination with in-flight sessions. Ratchet instead:
          # every file touched by a PR/push must be lint-clean; schedule a
          # dedicated `prettier --write` debt commit separately.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            BASE=$(git rev-parse HEAD^)
          fi
          FILES=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
            -- '*.ts' '*.tsx' '*.mjs' '*.js' | grep -v '^src/routeTree.gen.ts$' || true)
          if [ -z "$FILES" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          echo "$FILES" | xargs npx eslint

      - name: Doc hierarchy lint
        run: npm run lint:docs

      - name: TODO marker gate
        run: npm run lint:todos

      # Build BEFORE type check: src/routeTree.gen.ts is generated (gitignored)
      # by the TanStack router plugin during vite build — a fresh checkout has
      # no route tree, so tsc must run after generation.
      - name: Production build
        run: npm run build

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@users.noreply.github.com"

      # Diagnostic + gate: several suites shell out to ffmpeg with libmp3lame
      # (audio-sync fixtures). Probe the exact encode path they use so a
      # runner-image regression shows up as a clear message here.
      - name: Verify ffmpeg libmp3lame encode
        run: |
          set -e
          which ffmpeg
          ffmpeg -version | head -1
          TMP=$(mktemp -d)
          if ! ffmpeg -hide_banner -f lavfi -i "sine=frequency=440:duration=1" -codec:a libmp3lame -q:a 4 "$TMP/t.mp3" 2>&1 | tail -3; then
            echo "::error::ffmpeg on this runner cannot encode libmp3lame — audio-sync suites would fail"
            exit 1
          fi
          rm -rf "$TMP"
          echo "mp3 encode OK"

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .scratch/coverage
          retention-days: 7

  security:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (SARIF)
        run: semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif src/ scripts/

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
