name: Issue tracker signals

# 两条机器兜底，替代「靠自觉」：
#   1. open 票收到任何新评论 → 自动打 comments-unread
#      （信号出现在 `gh issue list` 的输出里 —— agent triage 时本来就会跑这条命令，
#       零额外调用、零额外自觉；读完并把状态落进 roadmap 后由该 session 摘掉）
#   2. 关票 → 校验存在交付记录评论；缺失则在原票留言提示，不改状态
#
# 规则出处：docs/agents/issue-tracker.md（Conventions 的 read-before-claim + Session cognitive offload）
# 标签定义：docs/agents/triage-labels.md（Signal Labels，由 CI 管理，不计入 triage 的 category/state 约定）

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]
  # 手工触发。默认 backfill=false 只做冒烟（证明本 workflow 真的能跑），不写任何标签。
  # 只有当存量票确实需要补信号时才用 backfill=true —— 见下方 manual job 的说明。
  workflow_dispatch:
    inputs:
      backfill:
        description: '给所有「已有评论」的 open 票补打 comments-unread（默认关；开着会把 -50% 的 open 票标记为未读，稀释信号）'
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  mark-unread:
    name: Mark new comment as unread state
    if: github.event_name == 'issue_comment' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 幂等：标签已存在时 addLabels 不报错
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['comments-unread'],
            });
            core.info(`comments-unread marked on #${context.issue.number}`);

  check-delivery-record:
    name: Check delivery record on close
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // 拒绝项没有交付记录可言
            const rejected =
              issue.state_reason === 'not_planned' ||
              issue.labels.some((l) => l.name === 'wontfix');
            if (rejected) {
              core.info('closed as not-planned / wontfix — no delivery record expected');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            // 交付记录的唯一 home 是评论（正文 write-once），以固定标记开头以便机器校验
            const marker = /交付记录|Delivery record/i;
            if (comments.some((c) => marker.test(c.body || ''))) {
              core.info(`delivery record found on #${issue.number} (${comments.length} comments)`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '⚠️ **交付记录缺失** —— 这张票已关闭，但没有任何评论带 `交付记录` / `Delivery record` 标记。',
                '',
                '按 `docs/agents/issue-tracker.md` 的 Session cognitive offload：per-issue 交付记录的**唯一 home 是评论**（正文是 write-once，不改）。',
                '',
                '请补一条**自包含**的交付记录评论——commit sha、验证证据（测试 / live evidence）、发现的机制、遗留项；标准是「没见过这个 session 的读者仅凭该评论就能恢复或审计这项工作」。',
              ].join('\n'),
            });
            core.info(`delivery record missing on #${issue.number} — reminder posted`);

  manual:
    name: Manual smoke test / backfill
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 两种用法，由 backfill 开关区分：
            //   false（默认）= 冒烟。跑通整条链、打印统计，不写任何标签。
            //                  用途：证明「Actions 已启用且本 workflow 真的能执行」，
            //                  以及随时复核还有多少 open 票带评论（存量信号覆盖率）。
            //   true        = 回填。给所有「已有评论但还没打标」的 open 票补 comments-unread。
            //  ⚠️ 回填是**一次性**动作，且是**有代价**的：它会把相当比例的 open 票标记为未读，
            //     让「未读」这个信号从"罕见且可动作"退化成"常态噪音"，agent 会学着忽略它。
            //     因此默认关。只有在明确接受这个代价时才开。
            const backfill = String(context.payload.inputs?.backfill) === 'true';
            const label = 'comments-unread';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            let openTickets = 0;
            let withComments = 0;
            let alreadyTagged = 0;
            let tagged = 0;

            for (const issue of issues) {
              if (issue.pull_request) continue; // issue list 会连 PR 一起返回
              openTickets += 1;
              if (!issue.comments) continue;    // 没有评论就没有未读状态可言
              withComments += 1;

              const has = issue.labels.some(
                (l) => (typeof l === 'string' ? l : l.name) === label,
              );
              if (has) {
                alreadyTagged += 1;
                continue;
              }
              if (!backfill) continue;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [label],
              });
              tagged += 1;
              core.info(`backfilled comments-unread on #${issue.number}`);
            }

            core.info(
              [
                `mode=${backfill ? 'backfill' : 'smoke'}`,
                `open_tickets=${openTickets}`,
                `with_comments=${withComments}`,
                `already_tagged=${alreadyTagged}`,
                `tagged_now=${tagged}`,
              ].join(' '),
            );

            if (!backfill) {
              core.info(
                'smoke only — no labels written. Re-run with backfill=true to tag the with_comments tickets.',
              );
            }
