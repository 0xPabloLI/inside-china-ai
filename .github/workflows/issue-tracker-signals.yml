name: Issue tracker signals

# 四条机器兜底，替代「靠自觉」：
#   1. open 票收到任何新评论 → 自动打 comments-unread
#      （信号出现在 `gh issue list` 的输出里 —— agent triage 时本来就会跑这条命令，
#       零额外调用、零额外自觉；读完并把状态落进 roadmap 后由该 session 摘掉）
#   2. 关票 → 校验存在交付记录评论；缺失则在原票留言提示并打 delivery-record-missing
#      （#315 账本：label 是可查询的持久状态，不再是一次性提醒）
#   3. 关票 → 剥掉 state / priority / signal 三类标签（deny-list），只留 category 与语义标签
#      —— 第 1 条是「发记录评论 → CI 打 comments-unread → 闭票」的必经链，
#         纯靠约定的清理规则在这里**机制性不可执行**，必须机器兜底
#   4. #315 交付记录账本闭环：补记录评论落地即摘标（事件驱动）+ 日 cron 兜底复检
#      与逾期催办 + 存量回填（workflow_dispatch + sweep_delivery）
#
# 规则出处：docs/agents/issue-tracker.md（Conventions 的 read-before-claim + Session cognitive offload）
# 标签定义：docs/agents/triage-labels.md（Signal Labels，由 CI 管理，不计入 triage 的 category/state 约定）

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]
  # 日跑一次 triage 陈旧度扫描（守卫：needs-triage 挂着没人管会重演 #318/319/320）
  schedule:
    - cron: "17 21 * * *" # 21:17 UTC = 每日 05:17 北京时间
  # 手工触发。默认 backfill=false 只做冒烟（证明本 workflow 真的能跑），不写任何标签。
  # 只有当存量票确实需要补信号时才用 backfill=true —— 见下方 manual job 的说明。
  workflow_dispatch:
    inputs:
      backfill:
        description: "给所有「已有评论」的 open 票补打 comments-unread（默认关；开着会把 -50% 的 open 票标记为未读，稀释信号）"
        type: boolean
        default: false
      sweep_closed:
        description: "扫存量已关闭票的 state/P/signal 标签残留（默认关；开着才跑 sweep-closed-labels job）"
        type: boolean
        default: false
      apply:
        description: "配合 sweep_closed / sweep_delivery：勾上才真的写标签，不勾只打印清单（dry-run）"
        type: boolean
        default: false
      triage_stale:
        description: "扫 needs-triage 超 3 天的 open 票并留言提醒分流（schedule 常态自动跑；这里用于手工补跑）"
        type: boolean
        default: false
      delivery_recheck:
        description: "复检交付记录账本 + 逾期催办（schedule 常态自动跑；这里用于手工补跑）"
        type: boolean
        default: false
      sweep_delivery:
        description: "扫存量已关闭票的「缺交付记录」并打 delivery-record-missing 标（默认关；配合 apply 才写）"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  mark-unread:
    name: Mark new comment as unread state
    # 票 = issue，不含 PR（backfill 任务同样跳过 PR）；bot 评论（Droid 审查
    # 追踪、Renovate 等）不是 triage 信号，也不该让 workflow 挂红 —— 对 PR
    # 打标签需要 pull-requests 权限，本 workflow 只有 issues: write。
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // ⚠️ 回读当前 state —— 事件 payload 里的 issue.state 是「评论创建那一刻」的快照。
            // 必经链是「发交付记录评论 → 关票」，而本 job 排在评论事件之后才跑完：
            // payload 仍写 open，于是给一张**已经关闭**的票打上 comments-unread。
            // #307/#309/#316/#317 四张已闭票全带 comments-unread，根因就在这里
            // （不只是时序，是这个晚到的 job 在闭票之后补刀）。
            const issueNumber = context.issue?.number ?? context.payload.issue?.number;
            const { data: current } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (current.state !== 'open') {
              core.info(`#${issueNumber} is ${current.state} — skip comments-unread`);
              return;
            }

            // 幂等：标签已存在时 addLabels 不报错
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['comments-unread'],
            });
            core.info(`comments-unread marked on #${issueNumber}`);

  check-delivery-record:
    name: Check delivery record on close
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // 拒绝项没有交付记录可言
            const rejected =
              issue.state_reason === 'not_planned' ||
              issue.labels.some((l) => l.name === 'wontfix');
            if (rejected) {
              core.info('closed as not-planned / wontfix — no delivery record expected');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            // 交付记录的唯一 home 是评论（正文 write-once），以固定标记开头以便机器校验。
            // ⚠️ Bot 评论不算数 —— 本 bot 自己发的缺失告警正文里就含「交付记录缺失」，
            // 会被 marker 误判成已补登（重开再关的场景：上一次的告警评论还在场）。
            // 交付记录只会由 session 以真实账号发出。
            const marker = /交付记录|Delivery record/i;
            const hasRecord = comments.some(
              (c) => c.user.type !== 'Bot' && marker.test(c.body || ''),
            );
            if (hasRecord) {
              // 重开再关且账本标签还挂着：顺手清掉，避免「有记录却带缺失标」的脏状态
              await github.rest.issues
                .removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'delivery-record-missing',
                })
                .catch((err) => {
                  if (err.status !== 404) throw err;
                });
              core.info(`delivery record found on #${issue.number} (${comments.length} comments)`);
              return;
            }

            // #315：缺失进账本 —— label 是可查询的持久状态
            // （gh issue list --label delivery-record-missing --state closed），
            // 不再是一次性留言；摘除与催办见下面两个 job。
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['delivery-record-missing'],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '⚠️ **交付记录缺失** —— 这张票已关闭，但没有任何评论带 `交付记录` / `Delivery record` 标记。',
                '',
                '按 `docs/agents/issue-tracker.md` 的 Session cognitive offload：per-issue 交付记录的**唯一 home 是评论**（正文是 write-once，不改）。',
                '',
                '请补一条**自包含**的交付记录评论——commit sha、验证证据（测试 / live evidence）、发现的机制、遗留项；标准是「没见过这个 session 的读者仅凭该评论就能恢复或审计这项工作」。',
                '',
                '补登后 `delivery-record-missing` 自动摘除；缺失超 3 天未补，日检会催办一次。',
              ].join('\n'),
            });
            core.info(`delivery record missing on #${issue.number} — reminder posted + ledger label set`);

  # #315：交付记录补登 → 立即摘账本标签（事件驱动，不等 cron）。
  # #252 的场景：记录在闭票同一分钟落地，旧门禁不复检、告警永不消。
  clear-delivery-record:
    name: Clear delivery-record-missing when a record lands
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;

            // 回读当前 state（与 mark-unread 同因：payload 是评论创建那一刻的快照）
            const { data: current } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // 账本标签只存在于 closed 票；open 票归 mark-unread 管
            if (current.state !== 'closed') return;
            // Bot 评论不算数：缺失告警与催办都是 bot 发的
            if (comment.user.type === 'Bot') return;

            const hasLedgerLabel = current.labels.some(
              (l) => (typeof l === 'string' ? l : l.name) === 'delivery-record-missing',
            );
            if (!hasLedgerLabel) return;

            const marker = /交付记录|Delivery record/i;
            const WAIVER = /无需交付记录|delivery-record-waived/i;
            // 豁免先判 —— 「无需交付记录」子串含「交付记录」，marker 先判会把豁免走成补登确认
            const isWaiver = WAIVER.test(comment.body || '');
            const isRecord = !isWaiver && marker.test(comment.body || '');
            if (!isRecord && !isWaiver) return;

            await github.rest.issues
              .removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: current.number,
                name: 'delivery-record-missing',
              })
              .catch((err) => {
                // 404 = 已被并发动作（如日 cron 复检）摘掉，不算失败
                if (err.status !== 404) throw err;
              });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: current.number,
              body: isWaiver
                ? '✅ 交付记录已豁免，摘除 `delivery-record-missing`。'
                : '✅ 交付记录已补登，摘除 `delivery-record-missing`（#315 账本闭环）。',
            });
            core.info(`#${current.number} delivery-record-missing cleared by user comment`);

  # #315：日 cron 复检账本 —— 兜底 comment 事件的竞态/漏网 + 逾期催办一次。
  delivery-record-recheck:
    name: Recheck delivery-record ledger
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.delivery_recheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LEDGER = 'delivery-record-missing';
            const ESCALATION = '<!-- delivery-record-escalation -->';
            const STALE_DAYS = 3;
            // 祖父化（用户裁决 2026-09-20）：cutoff = 门禁 CI 化 + 存量补登日。
            // 161 张约定前的旧闭票（dry-run 35511083073 实测）永不入账本、永不催办。
            const LEDGER_CUTOFF = Date.parse('2026-09-19T00:00:00Z');

            // 只扫账本内的票（服务端过滤），不重扫全量闭票
            const labeled = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: LEDGER,
              per_page: 100,
            });

            let cleared = 0;
            let escalated = 0;
            let pending = 0;
            for (const issue of labeled) {
              // 祖父化：cutoff 前闭票豁免账本 —— 不应有标签，有则静默摘除，绝不催办
              if (new Date(issue.closed_at).getTime() < LEDGER_CUTOFF) {
                await github.rest.issues
                  .removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: LEDGER,
                  })
                  .catch((err) => {
                    if (err.status !== 404) throw err;
                  });
                cleared += 1;
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              // Bot 评论不算数 —— 告警与催办评论都含「交付记录」字样，会假阳性
              const marker = /交付记录|Delivery record/i;
              // 显式豁免先判（#315 review 补的转移）：用户确认无需交付记录即清账；
              // 「无需交付记录」子串含「交付记录」，marker 先判会吞掉豁免分支
              const WAIVER = /无需交付记录|delivery-record-waived/i;
              const hasWaiver = comments.some(
                (c) => c.user.type !== 'Bot' && WAIVER.test(c.body || ''),
              );
              const hasRecord =
                !hasWaiver &&
                comments.some((c) => c.user.type !== 'Bot' && marker.test(c.body || ''));

              // 拒绝项没有交付记录可言 —— 摘掉误挂的账本标签即可
              const rejected =
                issue.state_reason === 'not_planned' ||
                issue.labels.some((l) => l.name === 'wontfix');
              if (rejected || hasRecord || hasWaiver) {
                await github.rest.issues
                  .removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: LEDGER,
                  })
                  .catch((err) => {
                    if (err.status !== 404) throw err;
                  });
                cleared += 1;
                continue;
              }

              pending += 1;
              const closedForDays =
                (Date.now() - new Date(issue.closed_at).getTime()) / 86_400_000;
              if (closedForDays < STALE_DAYS) continue;
              // 幂等催办：补登之前一张票只 @ 一次（marker 查重）
              if (comments.some((c) => c.body && c.body.includes(ESCALATION))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  ESCALATION,
                  `🏳️ 这张票已关闭超过 ${STALE_DAYS} 天，仍没有带 \`交付记录\` / \`Delivery record\` 标记的评论。`,
                  '',
                  `@${context.repo.owner} 请补登交付记录（commit / 证据 / 遗留项）；确认无需交付记录（如拒绝项）时，回复包含 \`无需交付记录\` 的评论即可清账。`,
                  '账本查询：`gh issue list --label delivery-record-missing --state closed`。',
                ].join('\n'),
              });
              escalated += 1;
              core.info(`#${issue.number} escalation posted (closed ${Math.floor(closedForDays)}d, still missing)`);
            }

            core.info(
              [
                `mode=delivery-record-recheck`,
                `ledger_size=${labeled.length}`,
                `cleared=${cleared}`,
                `pending=${pending}`,
                `escalated_now=${escalated}`,
              ].join(' '),
            );

  # #315：存量回填 —— 给全部已闭票中「缺交付记录」的打账本标签。
  # 只打标不留言：催办统一交给日 cron（回填当天不轰炸）。
  sweep-delivery-records:
    name: Sweep closed issues missing delivery records
    if: github.event_name == 'workflow_dispatch' && inputs.sweep_delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 与 strip-closed-labels 同一套 apply 门控：默认 dry-run 只打印清单
            const apply = String(context.payload.inputs?.apply) === 'true';
            const LEDGER = 'delivery-record-missing';
            // 祖父化（用户裁决 2026-09-20）：cutoff 前闭票不进账本（161 张历史票实测）
            const LEDGER_CUTOFF = Date.parse('2026-09-19T00:00:00Z');
            const marker = /交付记录|Delivery record/i;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100,
            });

            let inspected = 0;
            let missing = 0;
            let labeledNow = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue; // issue 端点会把 PR 一起返回
              inspected += 1;
              // 拒绝项没有交付记录可言
              const rejected =
                issue.state_reason === 'not_planned' ||
                issue.labels.some((l) => l.name === 'wontfix');
              if (rejected) continue;
              // 祖父化：cutoff（2026-09-19 门禁 CI 化 + 存量补登日）前闭票不进账本
              if (new Date(issue.closed_at).getTime() < LEDGER_CUTOFF) continue;
              const hasLedgerLabel = (issue.labels || []).some(
                (l) => (typeof l === 'string' ? l : l.name) === LEDGER,
              );
              if (hasLedgerLabel) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              // 旧 era 的 bot 告警评论含「交付记录」字样 —— 排除 Bot，否则漏挂账本
              if (comments.some((c) => c.user.type !== 'Bot' && marker.test(c.body || ''))) continue;

              missing += 1;
              core.info(`#${issue.number} missing delivery record${apply ? ' -> labeling' : ' (dry-run)'}`);
              if (!apply) continue;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [LEDGER],
              });
              labeledNow += 1;
            }

            core.info(
              [
                `mode=sweep-delivery-records`,
                `apply=${apply}`,
                `inspected=${inspected}`,
                `missing=${missing}`,
                `labeled_now=${labeledNow}`,
              ].join(' '),
            );
            if (!apply && missing > 0) {
              core.info('dry-run — no labels written. Re-run with apply=true to label the backlog.');
            }

  # 机器兜底替代「靠自觉」的清理规则。
  # 两种触发：
  #   · issues.closed          → 只处理刚关的那一票（常态路径）
  #   · workflow_dispatch + sweep_closed → 扫存量（job 只对未来闭票生效，存量必须回填）
  # dry-run / 实跑由 apply 输入区分（默认 dry-run，只打印清单不写）。
  strip-closed-labels:
    name: Strip state/priority/signal labels on close
    if: >-
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.sweep_closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // deny-list —— 与 docs/agents/issue-tracker.md「闭票只留 category」同源，
            // 改动规则文档时必须同步这里（两处都改，job 不会自己跟着文档变）。
            const STRIP = new Set([
              // state labels（triage-labels.md State Labels）
              // 注意 dormant：taxonomy 里长期未定义但已广泛使用，2026-09-20 补进文档
              'needs-triage', 'needs-info', 'ready-for-agent', 'ready-for-human', 'dormant',
              // signal labels（machine-managed）
              'comments-unread',
            ]);
            const isPriority = (name) => /^P[0-3]$/.test(name);

            // 保留：category（bug / enhancement / documentation / duplicate）、
            //       wontfix（「为什么关」的标记，剥了就丢语义）、
            //       roadmap 语义标签（video-automation / phase-* / wayfinder:map）
            const toStrip = (issue) =>
              (issue.labels || [])
                .map((l) => (typeof l === 'string' ? l : l.name))
                .filter((n) => STRIP.has(n) || isPriority(n));

            // ⚠️ 只有 sweep（手工触发）才受 apply 开关约束。
            // issues.closed 事件下 context.payload.inputs 是 undefined，
            // 若统一读 inputs?.apply 会恒为 false —— 常态路径退化成只打印不删的静默空转。
            // ⚠️ 事件名在脚本里只能读 context.eventName —— 这里的 `github` 是 Octokit 实例，
            // 没有 event_name 字段（写 github.event_name 会静默得到 undefined，
            // 首版正是这样把 sweep 判成 false、走进闭票分支读 undefined.issue 崩掉的）。
            // `if:` 里的 github.event_name 是 Actions 表达式上下文，那是另一回事，别混用。
            const apply = context.eventName === 'workflow_dispatch'
              ? String(context.payload.inputs?.apply) === 'true'
              : true;
            const sweep = context.eventName === 'workflow_dispatch';

            let inspected = 0;
            let wouldStrip = 0;
            let stripped = 0;

            const handle = async (issue) => {
              inspected += 1;
              const targets = toStrip(issue);
              if (!targets.length) return;
              wouldStrip += 1;
              core.info(`#${issue.number} -> strip [${targets.join(', ')}]${
                sweep ? `  keep [${(issue.labels||[]).map(l=>l.name||l).filter(n=>!targets.includes(n)).join(', ')}]` : ''}`);
              if (!apply) return;
              for (const name of targets) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name,
                  });
                  stripped += 1;
                } catch (err) {
                  // 404 = 已经被别的并发动作摘掉了，不算失败
                  if (err.status !== 404) throw err;
                  core.info(`#${issue.number} ${name} already gone (404) — ignored`);
                }
              }
            };

            if (sweep) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                per_page: 100,
              });
              for (const issue of issues) {
                if (issue.pull_request) continue; // issue 端点会把 PR 一起返回
                await handle(issue);
              }
            } else {
              await handle(context.payload.issue);
            }

            core.info(
              [
                `mode=${sweep ? 'sweep' : 'on-close'}`,
                `apply=${apply}`,
                `inspected=${inspected}`,
                `issues_with_targets=${wouldStrip}`,
                `labels_removed=${stripped}`,
              ].join(' '),
            );

            if (!apply && wouldStrip > 0) {
              core.info('dry-run — no labels removed. Re-run with apply=true to strip.');
            }

  manual:
    name: Manual smoke test / backfill
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 两种用法，由 backfill 开关区分：
            //   false（默认）= 冒烟。跑通整条链、打印统计，不写任何标签。
            //                  用途：证明「Actions 已启用且本 workflow 真的能执行」，
            //                  以及随时复核还有多少 open 票带评论（存量信号覆盖率）。
            //   true        = 回填。给所有「已有评论但还没打标」的 open 票补 comments-unread。
            //  ⚠️ 回填是**一次性**动作，且是**有代价**的：它会把相当比例的 open 票标记为未读，
            //     让「未读」这个信号从"罕见且可动作"退化成"常态噪音"，agent 会学着忽略它。
            //     因此默认关。只有在明确接受这个代价时才开。
            const backfill = String(context.payload.inputs?.backfill) === 'true';
            const label = 'comments-unread';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            let openTickets = 0;
            let withComments = 0;
            let alreadyTagged = 0;
            let tagged = 0;

            for (const issue of issues) {
              if (issue.pull_request) continue; // issue list 会连 PR 一起返回
              openTickets += 1;
              if (!issue.comments) continue;    // 没有评论就没有未读状态可言
              withComments += 1;

              const has = issue.labels.some(
                (l) => (typeof l === 'string' ? l : l.name) === label,
              );
              if (has) {
                alreadyTagged += 1;
                continue;
              }
              if (!backfill) continue;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [label],
              });
              tagged += 1;
              core.info(`backfilled comments-unread on #${issue.number}`);
            }

            core.info(
              [
                `mode=${backfill ? 'backfill' : 'smoke'}`,
                `open_tickets=${openTickets}`,
                `with_comments=${withComments}`,
                `already_tagged=${alreadyTagged}`,
                `tagged_now=${tagged}`,
              ].join(' '),
            );

            if (!backfill) {
              core.info(
                'smoke only — no labels written. Re-run with backfill=true to tag the with_comments tickets.',
              );
            }

  # 守卫（#321）：needs-triage 挂着没人管会重演（#318/319/320 三票悬空数日）。
  # 日跑：open + needs-triage 超过 3 天且尚未被提醒过（幂等 marker 查重）→ 留言
  # 提醒分流（落 roadmap 行或关票），不改状态、不摘标签 —— 那是 triage 的决定。
  triage-staleness:
    name: Remind on stale needs-triage issues
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.triage_stale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 幂等 marker：已提醒过的票跳过，绝不复读刷屏。
            const MARKER = '<!-- triage-stale-reminder -->';
            const STALE_DAYS = 3;

            const { data: staleCandidates } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'needs-triage',
              per_page: 100,
            });

            const cutoff = Date.now() - STALE_DAYS * 24 * 60 * 60 * 1000;
            let reminded = 0;
            for (const issue of staleCandidates) {
              if (new Date(issue.created_at).getTime() >= cutoff) continue;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some((c) => c.body && c.body.includes(MARKER))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  MARKER,
                  `⏳ 这张票挂 \`needs-triage\` 已超过 ${STALE_DAYS} 天，尚未分流。`,
                  '',
                  '分流动作：在 `docs/issue-roadmap.md` 的 Triage Inbox 落行（Phase / Wave / Tier），按 `docs/agents/triage-labels.md` 定 P 标签与 state 标签（`ready-for-agent` / 关闭），然后摘掉 `needs-triage`。分流前不要开工。',
                ].join('\n'),
              });
              reminded += 1;
              core.info(`#${issue.number} stale reminder posted`);
            }

            core.info(
              [
                `mode=triage-staleness`,
                `needs_triage_open=${staleCandidates.length}`,
                `stale_over_${STALE_DAYS}d=${staleCandidates.filter((i) => new Date(i.created_at).getTime() < cutoff).length}`,
                `reminded_now=${reminded}`,
              ].join(' '),
            );
