# Golden Query Evaluation Set for RAG
# Created: 2026-08-08
# Purpose: Quality regression baseline for RAG pipeline (Issue #15)
# Pass criterion: top-5 hit rate >= 80%
# Content indexed: 3 articles, 7 scene-data, 3 source materials, 1 research report, ~28 TikTok references
# Each query has an explicit `category` field for deterministic categorization.

# ── 1. Cross-language retrieval (EN query → CN source; CN query → EN article) ──

- query: "What did Liang Wenfeng say about AGI timelines?"
  category: cross-language
  expected_sources:
    - content_type: article
      source_id: deepseek-art-of-restraint
    - content_type: source-material
      source_id: deepseek-liang-investor-meeting-research
  notes: "English query should hit English article + Chinese source material (investor meeting transcript)"

- query: "梁文锋对开源有什么看法？"
  category: cross-language
  expected_sources:
    - content_type: article
      source_id: deepseek-art-of-restraint
  notes: "Chinese query about open source should hit English article about DeepSeek"

- query: "字节跳动内部反蒸馏规定是什么时候发布的？"
  category: cross-language
  expected_sources:
    - content_type: article
      source_id: bytedance-zhang-yiming-no-distillation
    - content_type: source-material
      source_id: bytedance-zhang-yiming-no-distillation-research
  notes: "Chinese query should hit English article + Chinese source material about ByteDance"

- query: "How does encrypted chain-of-thought extraction work?"
  category: cross-language
  expected_sources:
    - content_type: article
      source_id: china-llm-distillation-storm
    - content_type: source-material
      source_id: china-llm-distillation-research
  notes: "English technical query should hit distillation article + Chinese source material"

- query: "张一鸣为什么不蒸馏？"
  category: cross-language
  expected_sources:
    - content_type: article
      source_id: bytedance-zhang-yiming-no-distillation
  notes: "Chinese query about Zhang Yiming's anti-distillation stance should hit English article"

